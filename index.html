<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WFS Bank</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Fraunces:opsz,wght@9..144,600&display=swap">
<style>
:root{--navy:#101d5c;--blue:#2547d0;--pink:#ff4f9a;--blush:#fff0f6;--bg:#f5f6fc;--card:#fff;--ink:#17193a;--mute:#6b6f93;--line:#e4e6f4;--ok:#0f9b6c;--bad:#d6335f;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0c1030;--card:#161b47;--ink:#eef0ff;--mute:#9aa0d0;--line:#262c66;--blush:#2a1740}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(150deg,var(--navy),var(--blue) 70%);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-120px;bottom:-120px;width:420px;height:420px;border-radius:50%;background:var(--pink);opacity:.9}
.hero h2{font-family:Fraunces,Georgia,serif;font-size:clamp(32px,4.4vw,56px);line-height:1.08;margin:0;max-width:11ch;position:relative;z-index:1}
.hero p{max-width:34ch;opacity:.85;position:relative;z-index:1}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.04em}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--pink);display:grid;place-items:center;color:#fff;font-style:normal;font-family:Fraunces,serif}
.lform{display:grid;place-content:center;padding:32px}
.lform form{width:min(360px,100%);display:grid;gap:14px}
.lform h1{font-family:Fraunces,Georgia,serif;margin:0 0 4px;font-size:30px}
label{font-size:13px;color:var(--mute);display:grid;gap:6px}
input,select{padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);width:100%}
input:focus,select:focus{border-color:var(--blue)}
.btn{border:0;border-radius:12px;padding:13px 18px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer}
.btn:hover{background:var(--navy)}
.btn.pink{background:var(--pink)}.btn.pink:hover{background:#e93a85}
.btn.ghost{background:transparent;color:var(--blue);border:1.5px solid var(--line)}
.err{color:var(--bad);font-size:13px;min-height:18px}
.note{font-size:12px;color:var(--mute)}
/* app */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--navy);color:#cfd5ff;padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
nav .logo{color:#fff;margin:0 8px 22px}
nav button{background:none;border:0;color:inherit;text-align:left;padding:12px 14px;border-radius:12px;cursor:pointer;display:flex;gap:12px;align-items:center}
nav button:hover{background:rgba(255,255,255,.08)}
nav button.on{background:var(--pink);color:#fff;font-weight:600}
nav .out{margin-top:auto}
main{padding:28px clamp(16px,4vw,44px);max-width:1100px;width:100%}
header.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px;flex-wrap:wrap}
h2.t{font-family:Fraunces,Georgia,serif;font-size:28px;margin:0}
.who{display:flex;align-items:center;gap:10px;font-size:14px}
.av{width:38px;height:38px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
.bal{background:linear-gradient(135deg,var(--blue),var(--navy));color:#fff;border:0;position:relative;overflow:hidden}
.bal:after{content:"";position:absolute;right:-50px;top:-50px;width:180px;height:180px;border-radius:50%;background:var(--pink);opacity:.85}
.bal>*{position:relative;z-index:1}
.bal .amt{font-family:Fraunces,Georgia,serif;font-size:clamp(36px,6vw,54px);margin:6px 0}
.grid{display:grid;gap:16px}.g2{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.lbl{font-size:13px;opacity:.8}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.quick button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px;cursor:pointer;display:grid;gap:4px;justify-items:center;font-size:13px}
.quick button:hover{border-color:var(--pink);background:var(--blush)}
.quick span{font-size:22px}
h3{margin:0 0 12px;font-size:16px}
.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border:0}
.tx b{display:block;font-size:14px}.tx small{color:var(--mute)}
.pos{color:var(--ok);font-weight:600}.neg{color:var(--bad);font-weight:600}
.form{display:grid;gap:14px;max-width:460px}
.msg{padding:12px 14px;border-radius:12px;background:var(--blush);border:1px solid var(--pink);font-size:14px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:30px;padding:8px 14px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:center}
.chip.on{border-color:var(--pink);background:var(--blush)}
.chip i{width:26px;height:26px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-style:normal;font-size:11px}
.tag{font-size:12px;padding:3px 10px;border-radius:20px;background:var(--blush);color:var(--pink);font-weight:600}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;background:var(--pink)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tabs-m{display:none}
@media(max-width:820px){
#login{grid-template-columns:1fr}.hero{min-height:260px;padding:28px}
#app{grid-template-columns:1fr}
nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
nav .logo{display:none}nav button{flex-direction:column;gap:2px;font-size:11px;padding:8px 10px;white-space:nowrap;text-align:center}nav .out{margin:0}
main{padding-bottom:110px}.g2,.g3{grid-template-columns:1fr}.quick{grid-template-columns:repeat(2,1fr)}
}
@media(prefers-reduced-motion:no-preference){.view{animation:in .25s ease}@keyframes in{from{opacity:.4}to{opacity:1}}}
</style>
</head>
<body>

<section id="login">
  <div class="hero">
    <div class="logo"><i>W</i> WFS BANK</div>
    <div><h2>Banking that moves with you.</h2><p>Move money, pay bills and track every dollar in one secure place.</p></div>
  </div>
  <div class="lform">
    <form id="lf" autocomplete="off">
      <h1>Sign in</h1>
      <label>Username<input id="u" required autocapitalize="off" spellcheck="false"></label>
      <label>Password<input id="p" type="password" required></label>
      <div class="err" id="le" role="alert"></div>
      <button class="btn pink" type="submit">Sign in to WFS Bank</button>
      <div class="note">Demo site: no real money or data. Login is checked in your browser only.</div>
    </form>
  </div>
</section>

<div id="app" class="hide">
  <nav id="nav"></nav>
  <main>
    <header class="top">
      <h2 class="t" id="title">Dashboard</h2>
      <div class="who"><span>Chris Fairchild</span><div class="av">CF</div></div>
    </header>
    <div id="view" class="view"></div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const fmt=n=>(n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"});
const S={
 acc:{Checking:710000,Savings:52400},
 num:{Checking:"•••• 4417",Savings:"•••• 9082"},
 frozen:false,
 contacts:["Maya Torres","Devon Brooks","Priya Nair","Leo Hart"],
 loans:[{n:"Auto loan",bal:14250,total:22000,pay:412.5,due:"Oct 28"},{n:"Home improvement loan",bal:9800,total:15000,pay:285,due:"Nov 3"}],
 tx:[
  {d:"Oct 8, 2026",t:"Payroll deposit — Fairchild Holdings",c:"Income",a:12500,ac:"Checking"},
  {d:"Oct 7, 2026",t:"Whole Foods Market",c:"Groceries",a:-186.42,ac:"Checking"},
  {d:"Oct 6, 2026",t:"Electric company",c:"Bill payment",a:-214.9,ac:"Checking"},
  {d:"Oct 5, 2026",t:"Sent to Maya Torres",c:"P2P",a:-250,ac:"Checking"},
  {d:"Oct 3, 2026",t:"Interest earned",c:"Income",a:96.3,ac:"Savings"},
  {d:"Oct 2, 2026",t:"Delta Air Lines",c:"Travel",a:-642.18,ac:"Checking"},
  {d:"Oct 1, 2026",t:"Rent — Park Avenue Residences",c:"Housing",a:-4800,ac:"Checking"},
  {d:"Sep 29, 2026",t:"Received from Devon Brooks",c:"P2P",a:320,ac:"Checking"}
 ]
};
const views={dash:["Dashboard","🏠"],xfer:["Transfer","⇄"],bills:["Bill pay","🧾"],p2p:["Send money","💸"],acct:["Accounts","🏦"],loan:["Loans & deposits","📈"],hist:["History","📜"]};
function buildNav(){
 $("#nav").innerHTML='<div class="logo"><i>W</i> WFS BANK</div>'+Object.entries(views).map(([k,v])=>`<button data-v="${k}"><span>${v[1]}</span>${v[0]}</button>`).join("")+'<button class="out" id="so"><span>🚪</span>Sign out</button>';
 $("#nav").onclick=e=>{const b=e.target.closest("button");if(!b)return;if(b.id==="so"){signOut();return}go(b.dataset.v)};
}
function go(v){
 $("#title").textContent=views[v][0];
 document.querySelectorAll("nav button[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
 $("#view").innerHTML=R[v]();if(B[v])B[v]();scrollTo(0,0);
}
function signOut(){$("#app").classList.add("hide");$("#login").classList.remove("hide");$("#p").value="";$("#u").value=""}
$("#lf").onsubmit=e=>{
 e.preventDefault();
 if($("#u").value==="Chrischild"&&$("#p").value==="Fairchild200$"){
  $("#le").textContent="";$("#login").classList.add("hide");$("#app").classList.remove("hide");buildNav();go("dash");
 }else $("#le").textContent="Username or password is incorrect. Check both and try again.";
};
function txRow(x){return `<div class="tx"><div><b>${x.t}</b><small>${x.d} · ${x.c} · ${x.ac}</small></div><span class="${x.a>0?"pos":"neg"}">${x.a>0?"+":""}${fmt(x.a)}</span></div>`}
function post(t,c,a,ac){S.acc[ac]+=a;S.tx.unshift({d:today(),t,c,a,ac})}
function acctOpts(){return Object.keys(S.acc).map(k=>`<option>${k}</option>`).join("")}
function flash(m,ok=true){const el=$("#fm");if(el){el.className="msg";el.textContent=m;el.style.borderColor=ok?"var(--pink)":"var(--bad)"}}
const R={
dash:()=>`
<div class="card bal"><div class="lbl">Available balance · Checking ${S.num.Checking}</div><div class="amt">${fmt(S.acc.Checking)}</div><div class="lbl">${S.frozen?"Card frozen":"Account in good standing"}</div></div>
<div class="quick">
 <button data-g="xfer"><span>⇄</span>Transfer</button><button data-g="bills"><span>🧾</span>Pay a bill</button>
 <button data-g="p2p"><span>💸</span>Send money</button><button data-g="loan"><span>📈</span>Loans</button></div>
<div class="grid g2">
 <div class="card"><h3>Recent transactions</h3>${S.tx.slice(0,5).map(txRow).join("")}</div>
 <div class="grid"><div class="card"><h3>Savings ${S.num.Savings}</h3><div class="amt" style="font-family:Fraunces,serif;font-size:28px">${fmt(S.acc.Savings)}</div></div>
 <div class="card"><h3>Next loan payment</h3><b>${S.loans[0].n}</b><div class="note">${fmt(S.loans[0].pay)} due ${S.loans[0].due}</div></div></div>
</div>`,
xfer:()=>`<div class="card"><div class="form"><h3>Move money</h3>
<label>From<select id="xf">${acctOpts()}</select></label>
<label>To<select id="xt"><option>Savings</option><option>Checking</option><option value="ext">Another bank (external)</option></select></label>
<label id="xl" class="hide">Recipient account number<input id="xn" inputmode="numeric" placeholder="10-digit number"></label>
<label>Amount (USD)<input id="xa" type="number" min="0.01" step="0.01"></label>
<button class="btn" id="xb">Transfer funds</button><div id="fm"></div></div></div>`,
bills:()=>`<div class="card"><div class="form"><h3>Pay a bill</h3>
<label>Payee<select id="bp"><option>Electric company</option><option>Water utility</option><option>Internet provider</option><option>Mobile carrier</option><option>Credit card</option><option>Insurance</option></select></label>
<label>Amount (USD)<input id="ba" type="number" min="0.01" step="0.01"></label>
<label>Pay from<select id="bf">${acctOpts()}</select></label>
<button class="btn pink" id="bb">Pay bill</button><div id="fm"></div></div></div>`,
p2p:()=>`<div class="card"><div class="form"><h3>Send money to a person</h3>
<div class="chips" id="ch">${S.contacts.map((c,i)=>`<button type="button" class="chip" data-n="${c}"><i>${c.split(" ").map(w=>w[0]).join("")}</i>${c}</button>`).join("")}</div>
<label>Recipient (name, phone or email)<input id="pn"></label>
<label>Amount (USD)<input id="pa" type="number" min="0.01" step="0.01"></label>
<label>Note<input id="pt" maxlength="60" placeholder="Dinner, rent share…"></label>
<button class="btn pink" id="pb">Send money</button><div id="fm"></div></div></div>`,
acct:()=>`<div class="grid g2">${Object.keys(S.acc).map(k=>`<div class="card"><div class="row"><h3>${k}</h3><span class="tag">${k==="Savings"?"4.1% APY":"Primary"}</span></div><div class="note">${S.num[k]}</div><div style="font-family:Fraunces,serif;font-size:30px;margin-top:8px">${fmt(S.acc[k])}</div></div>`).join("")}
<div class="card"><h3>Profile</h3><div class="tx"><span>Account holder</span><b>Chris Fairchild</b></div><div class="tx"><span>Username</span><b>Chrischild</b></div><div class="tx"><span>Billing address</span><b>1739 N High St, Columbus, OH 43210, USA</b></div><div class="tx"><span>Member since</span><b>2019</b></div></div>
<div class="card"><h3>Settings</h3><div class="row"><span>Debit card</span><button class="btn ghost" id="fz">${S.frozen?"Unfreeze card":"Freeze card"}</button></div><div class="row" style="margin-top:14px"><span>Statements</span><button class="btn ghost" id="st">Download CSV</button></div><div id="fm" style="margin-top:12px"></div></div></div>`,
loan:()=>`<div class="grid g2"><div>${S.loans.map(l=>`<div class="card" style="margin-bottom:16px"><div class="row"><h3>${l.n}</h3><span class="tag">Due ${l.due}</span></div>
<div class="bar"><i style="width:${Math.round((1-l.bal/l.total)*100)}%"></i></div><div class="note">${fmt(l.bal)} left of ${fmt(l.total)} · monthly ${fmt(l.pay)}</div></div>`).join("")}
<div class="card"><div class="form"><h3>Deposit funds</h3><label>Into<select id="da">${acctOpts()}</select></label><label>Amount (USD)<input id="dm" type="number" min="0.01" step="0.01"></label><button class="btn" id="db">Deposit</button><div id="fm"></div></div></div></div>
<div class="card"><div class="form"><h3>Apply for a loan</h3><label>Loan type<select id="lt"><option>Personal loan</option><option>Auto loan</option><option>Home loan</option></select></label>
<label>Amount (USD)<input id="la" type="number" min="1000" step="500"></label><label>Term<select id="ly"><option>12 months</option><option>36 months</option><option>60 months</option></select></label>
<button class="btn pink" id="lb">Submit application</button><div id="lm"></div></div></div></div>`,
hist:()=>`<div class="card"><div class="row" style="margin-bottom:8px"><h3 style="margin:0">All transactions</h3>
<select id="hf" style="width:auto"><option value="">All accounts</option>${Object.keys(S.acc).map(k=>`<option>${k}</option>`).join("")}</select></div><div id="hl">${S.tx.map(txRow).join("")}</div></div>`
};
function num(id){return parseFloat($(id).value)}
const B={
dash(){document.querySelectorAll("[data-g]").forEach(b=>b.onclick=()=>go(b.dataset.g))},
xfer(){
 $("#xt").onchange=e=>$("#xl").classList.toggle("hide",e.target.value!=="ext");
 $("#xb").onclick=()=>{
  const f=$("#xf").value,t=$("#xt").value,a=num("#xa");
  if(!(a>0))return flash("Enter an amount above $0.",false);
  if(a>S.acc[f])return flash("Not enough funds in "+f+".",false);
  if(t===f)return flash("Choose two different accounts.",false);
  if(t==="ext"){if(!/^\d{10}$/.test($("#xn").value))return flash("Enter a 10-digit account number.",false);post("Transfer to external ••"+$("#xn").value.slice(-4),"Transfer",-a,f)}
  else{post("Transfer to "+t,"Transfer",-a,f);post("Transfer from "+f,"Transfer",a,t)}
  flash("Transferred "+fmt(a)+". New "+f+" balance: "+fmt(S.acc[f]));$("#xa").value="";
 }},
bills(){$("#bb").onclick=()=>{
 const a=num("#ba"),f=$("#bf").value,p=$("#bp").value;
 if(!(a>0))return flash("Enter an amount above $0.",false);
 if(a>S.acc[f])return flash("Not enough funds in "+f+".",false);
 post(p,"Bill payment",-a,f);flash(p+" paid: "+fmt(a)+".");$("#ba").value="";}},
p2p(){
 $("#ch").onclick=e=>{const c=e.target.closest(".chip");if(!c)return;document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));c.classList.add("on");$("#pn").value=c.dataset.n};
 $("#pb").onclick=()=>{
  const a=num("#pa"),n=$("#pn").value.trim();
  if(!n)return flash("Choose or enter a recipient.",false);
  if(!(a>0))return flash("Enter an amount above $0.",false);
  if(a>S.acc.Checking)return flash("Not enough funds in Checking.",false);
  post("Sent to "+n+($("#pt").value?" — "+$("#pt").value:""),"P2P",-a,"Checking");
  flash("Sent "+fmt(a)+" to "+n+".");$("#pa").value="";}},
acct(){
 $("#fz").onclick=()=>{S.frozen=!S.frozen;$("#fz").textContent=S.frozen?"Unfreeze card":"Freeze card";flash(S.frozen?"Debit card frozen.":"Debit card active.")};
 $("#st").onclick=()=>{
  const csv="Date,Description,Category,Account,Amount\n"+S.tx.map(x=>[x.d,'"'+x.t+'"',x.c,x.ac,x.a].join(",")).join("\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="wfs-statement.csv";a.click();flash("Statement downloaded.")}},
loan(){
 $("#db").onclick=()=>{const a=num("#dm"),ac=$("#da").value;if(!(a>0))return flash("Enter an amount above $0.",false);post("Deposit","Deposit",a,ac);flash("Deposited "+fmt(a)+" into "+ac+".");$("#dm").value=""};
 $("#lb").onclick=()=>{const a=num("#la"),m=$("#lm");if(!(a>=1000)){m.className="msg";m.textContent="Enter at least $1,000.";return}
  m.className="msg";m.textContent=$("#lt").value+" application for "+fmt(a)+" over "+$("#ly").value+" submitted. A decision arrives in 1–2 business days."}},
hist(){$("#hf").onchange=e=>{const v=e.target.value;$("#hl").innerHTML=S.tx.filter(x=>!v||x.ac===v).map(txRow).join("")}}
};
</script>
</body>
</html>
